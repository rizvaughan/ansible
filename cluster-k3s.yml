- hosts: k3s_server
  become: yes
  tasks:
    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to exist
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Fetch the join token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Share token and IP with other plays
      add_host:
        name: "k3s_join_facts"
        k3s_token: "{{ node_token.content | b64decode | trim }}"
        k3s_ip: "{{ ansible_default_ipv4.address }}"

- hosts: k3s_agent
  become: yes
  vars:
    k3s_server_ip: "{{ hostvars['k3s_join_facts']['k3s_ip'] }}"
    k3s_token: "{{ hostvars['k3s_join_facts']['k3s_token'] }}"
  tasks:
    - name: Install k3s agent and join cluster
      shell: "curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_server_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -"
      args:
        creates: /usr/local/bin/k3s
